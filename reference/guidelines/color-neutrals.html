<!-- @dsCard group="Colors" viewport="700x150" name="Warm Neutrals" subtitle="Brown-tinted grays — never cold/blue gray." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--surface-card); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 64px; }
  .meta { padding: 6px 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-body); line-height: 1.4; }
  .meta b { display: block; font-weight: 700; color: var(--text-strong); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--neutral-0)"></div><div class="meta"><b>0</b>#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-50)"></div><div class="meta"><b>50</b>#FBF8F6</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-100)"></div><div class="meta"><b>100</b>#F5F0EC</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-200)"></div><div class="meta"><b>200</b>#E9E1DA</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-300)"></div><div class="meta"><b>300</b>#D6CABF</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-400)"></div><div class="meta"><b>400</b>#B0A398</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-500)"></div><div class="meta"><b>500</b>#847669</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-600)"></div><div class="meta"><b>600</b>#5F544A</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-700)"></div><div class="meta"><b>700</b>#443B34</div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-900)"></div><div class="meta"><b>900</b>#181411</div></div>
  </div>
</body>
</html>
