<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation / Shadows" subtitle="Warm brown-tinted shadows + brand glow." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 20px; background: var(--surface-page); font-family: var(--font-mono); }
  .row { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .item { text-align: center; }
  .box { width: 82px; height: 60px; background: var(--surface-card); border-radius: var(--radius-md); }
  .lab { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
  .lab b { display: block; color: var(--text-strong); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lab"><b>xs</b></div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab"><b>sm</b></div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab"><b>md</b></div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab"><b>lg</b></div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="lab"><b>xl</b></div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-brand)"></div><div class="lab"><b>brand</b></div></div>
  </div>
</body>
</html>
