<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--surface-card); font-family: var(--font-sans); display: flex; }
  .light { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--neutral-0); padding: 20px; }
  .dark { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--neutral-900); padding: 20px; }
  img { height: 120px; }
  .tag { position: absolute; bottom: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="light"><img src="../assets/logos/tangerine-logo.png" alt="Tangerine logo"></div>
  <div class="dark"><img src="../assets/logos/tangerine-logo.png" alt="Tangerine logo on dark"></div>
</body>
</html>
