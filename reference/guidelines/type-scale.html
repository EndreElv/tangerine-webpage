<!-- @dsCard group="Type" viewport="700x300" name="Type Scale" subtitle="1.250 major third — 11 → 76px." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 20px; background: var(--surface-card); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 3px 0; border-bottom: 1px solid var(--neutral-100); }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 130px; flex: none; }
  .samp { font-family: var(--font-display); font-weight: 700; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="row"><span class="tok">--text-5xl · 60</span><span class="samp" style="font-size:48px">Tangerine</span></div>
  <div class="row"><span class="tok">--text-4xl · 48</span><span class="samp" style="font-size:40px">Tangerine</span></div>
  <div class="row"><span class="tok">--text-3xl · 36</span><span class="samp" style="font-size:32px">Actionable insights</span></div>
  <div class="row"><span class="tok">--text-2xl · 28</span><span class="samp" style="font-size:26px">Actionable insights</span></div>
  <div class="row"><span class="tok">--text-xl · 22</span><span class="samp" style="font-size:22px">Section heading</span></div>
  <div class="row"><span class="tok">--text-lg · 18</span><span class="samp" style="font-size:18px;font-family:var(--font-sans);font-weight:600">Lead paragraph</span></div>
  <div class="row"><span class="tok">--text-md · 16</span><span class="samp" style="font-size:16px;font-family:var(--font-sans);font-weight:400">Body — base size for reading</span></div>
  <div class="row"><span class="tok">--text-sm · 14</span><span class="samp" style="font-size:14px;font-family:var(--font-sans);font-weight:400">Secondary / supporting text</span></div>
  <div class="row"><span class="tok">--text-xs · 12</span><span class="samp" style="font-size:12px;font-family:var(--font-sans);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tangerine-600)">Eyebrow label</span></div>
</body>
</html>
