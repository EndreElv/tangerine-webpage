<!-- @dsCard group="Colors" viewport="700x150" name="Accent — Gold" subtitle="Gradient endpoint #FCB40C (400). Pairs with tangerine." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--surface-card); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); position: relative; }
  .chip { height: 64px; }
  .meta { padding: 6px 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-body); line-height: 1.4; }
  .meta b { display: block; font-weight: 700; color: var(--text-strong); }
  .star { position: absolute; top: 6px; right: 8px; color: var(--neutral-900); font-family: var(--font-sans); font-weight: 800; font-size: 11px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--gold-50)"></div><div class="meta"><b>50</b>#FFF8E6</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-100)"></div><div class="meta"><b>100</b>#FFEFC2</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-200)"></div><div class="meta"><b>200</b>#FFE08A</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-300)"></div><div class="meta"><b>300</b>#FCCB44</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-400)"><span class="star">★</span></div><div class="meta"><b>400</b>#FCB40C</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-500)"></div><div class="meta"><b>500</b>#E89F00</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-600)"></div><div class="meta"><b>600</b>#C28400</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-700)"></div><div class="meta"><b>700</b>#946400</div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-800)"></div><div class="meta"><b>800</b>#6B4900</div></div>
    <div class="sw"><div class="chip" style="background:var(--rind-400)"></div><div class="meta"><b>rind</b>#E6E36A</div></div>
  </div>
</body>
</html>
