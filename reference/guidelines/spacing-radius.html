<!-- @dsCard group="Spacing" viewport="700x150" name="Radius Scale" subtitle="Soft, rounded corners — xs 4 → pill." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-card); font-family: var(--font-mono); }
  .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .item { text-align: center; }
  .box { width: 64px; height: 56px; background: var(--tangerine-100); border: 2px solid var(--tangerine-400); }
  .lab { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .lab b { display: block; color: var(--text-strong); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lab"><b>xs</b>4px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab"><b>sm</b>8px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab"><b>md</b>12px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab"><b>lg</b>16px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab"><b>xl</b>24px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="lab"><b>2xl</b>32px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:90px"></div><div class="lab"><b>pill</b>999</div></div>
  </div>
</body>
</html>
