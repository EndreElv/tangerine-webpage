<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Tangerine" subtitle="Brand base #F05424 (500). Hover 600, pressed 700." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--surface-card); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 64px; }
  .meta { padding: 6px 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-body); line-height: 1.4; }
  .meta b { display: block; font-weight: 700; color: var(--text-strong); }
  .star { position: absolute; top: 6px; right: 8px; color: #fff; font-family: var(--font-sans); font-weight: 800; font-size: 11px; }
  .sw { position: relative; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--tangerine-50)"></div><div class="meta"><b>50</b>F05424·08%</div></div>
    <div class="sw"><div class="chip" style="background:var(--tangerine-100)"></div><div class="meta"><b>100</b>#FFE2D6</div></div>
    <div class="sw"><div class="chip" style="background:var(--tangerine-200)"></div><div class="meta"><b>200</b>#FFC4AD</div></div>
    <div class="sw"><div class="chip" style="background:var(--tangerine-300)"></div><div class="meta"><b>300</b>#FB9D7C</div></div>
    <div class="sw"><div class="chip" style="background:var(--tangerine-400)"></div><div class="meta"><b>400</b>#F57650</div></div>
    <div class="sw"><div class="chip" style="background:var(--tangerine-500)"><span class="star">★</span></div><div class="meta"><b>500</b>#F05424</div></div>
    <div class="sw"><div class="chip" style="background:var(--tangerine-600)"></div><div class="meta"><b>600</b>#DD431A</div></div>
    <div class="sw"><div class="chip" style="background:var(--tangerine-700)"></div><div class="meta"><b>700</b>#B23414</div></div>
    <div class="sw"><div class="chip" style="background:var(--tangerine-800)"></div><div class="meta"><b>800</b>#8A2810</div></div>
    <div class="sw"><div class="chip" style="background:var(--tangerine-900)"></div><div class="meta"><b>900</b>#5E1B0B</div></div>
  </div>
</body>
</html>
