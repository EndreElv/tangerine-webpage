<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base grid · space-1 → space-10." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-card); font-family: var(--font-mono); }
  .row { display: flex; align-items: center; gap: 12px; padding: 3px 0; }
  .bar { background: var(--tangerine-400); height: 14px; border-radius: 3px; }
  .lab { font-size: 11px; color: var(--text-muted); width: 150px; flex: none; }
  .lab b { color: var(--text-strong); }
</style>
</head>
<body>
  <div class="row"><span class="lab"><b>--space-1</b> 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lab"><b>--space-2</b> 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lab"><b>--space-3</b> 12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lab"><b>--space-4</b> 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lab"><b>--space-5</b> 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lab"><b>--space-6</b> 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lab"><b>--space-7</b> 40px</span><div class="bar" style="width:40px"></div></div>
  <div class="row"><span class="lab"><b>--space-8</b> 48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="lab"><b>--space-9</b> 64px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="lab"><b>--space-10</b> 80px</span><div class="bar" style="width:80px"></div></div>
</body>
</html>
