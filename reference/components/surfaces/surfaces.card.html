<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  h4 { font-family: var(--font-display); margin: 0 0 4px; font-size: 18px; color: var(--text-strong); }
  p { margin: 0; font-size: 13px; color: var(--text-muted); }
  .stats { display: flex; gap: 28px; margin-top: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Card, Stat } = window.TangerineDesignSystem_c907c9;
function Demo() {
  return (
    <div>
      <div className="grid">
        <Card elevation="flat"><h4>Flat</h4><p>Subtle border, no shadow.</p></Card>
        <Card elevation="raised" accentTop><h4>Raised + accent</h4><p>Shadow with a brand top bar.</p></Card>
        <Card interactive media="../../assets/imagery/reading.jpg"><h4>Reading</h4><p>Hover to lift.</p></Card>
      </div>
      <div className="stats">
        <Stat value="5.1M" label="assessments conducted" gradient size="lg" />
        <Stat value="65" label="countries" />
        <Stat value="86.4%" label="reading fluency" delta="+4.2 pts" trend="up" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
