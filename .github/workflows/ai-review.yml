name: AI review

# Trusted companion to ci.yml. Triggered by CI completing on a PR, this runs in
# the BASE-repo context, so it is the ONE place ANTHROPIC_API_KEY may live. It
# reads the PR's changed files (content at head) + unified diff via the API and
# runs the AI reviewers (SEO, code quality, brand voice). It deliberately checks
# out trusted `main` and NEVER checks out or executes PR-authored code — that is
# why holding the key here is safe and why ci.yml (which runs PR code) holds none.
#
# Launches ADVISORY: it posts one check-run per reviewer (success / neutral /
# failure) but those checks are NOT in the required set yet. Promote them in
# branch protection once calibrated — same path used for the visual gate
# (see docs/agent/pipeline-setup.md). A high-confidence, evidence-backed "block"
# is a check failure; everything uncertain becomes "escalate" → a neutral check
# plus the `needs-human-review` label, which holds auto-merge for a human.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  ai-review:
    name: ai-review
    # Only review PR-triggered CI runs.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Trusted runner code from the base repo (default branch) — NOT the PR head.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Resolve PR from the triggering run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let pr = run.pull_requests && run.pull_requests[0];
            if (!pr) {
              const { data } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
              });
              pr = data[0];
            }
            if (!pr) {
              core.info('No open PR for this run — skipping AI review.');
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('number', pr.number);
            core.setOutput('head_sha', run.head_sha);

      - name: Build review input (changed files + diff)
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const pr = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const MAX_FILES = 60;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr, per_page: 100,
            });
            const picked = files.filter((f) => f.status !== 'removed').slice(0, MAX_FILES);
            if (files.length > MAX_FILES) {
              core.warning(`PR changes ${files.length} files; reviewing the first ${MAX_FILES}.`);
            }

            const out = [];
            for (const f of picked) {
              try {
                const res = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo, path: f.filename, ref: headSha,
                });
                if (!res.data || !res.data.content) continue; // dir or unavailable
                const content = Buffer.from(res.data.content, res.data.encoding).toString('utf8');
                if (content.length <= 100000) out.push({ path: f.filename, status: f.status, content });
                else core.warning(`Skipping large file ${f.filename} (${content.length} bytes).`);
              } catch (e) {
                core.warning(`Could not fetch ${f.filename}: ${e.message}`);
              }
            }

            const diffResp = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr,
              mediaType: { format: 'diff' },
            });

            fs.writeFileSync('ai-review-input.json', JSON.stringify({
              prNumber: pr, headSha, files: out, diff: String(diffResp.data).slice(0, 200000),
            }));
            core.info(`Wrote ai-review-input.json (${out.length} files).`);

      - name: Run AI reviewers
        if: steps.pr.outputs.found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'claude-opus-4-8' }}
          AI_REVIEW_EFFORT: ${{ vars.AI_REVIEW_EFFORT || 'high' }}
        run: npm run ai-review

      - name: Publish check-runs + escalation label
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const headSha = process.env.HEAD_SHA;
            const prNumber = Number(process.env.PR_NUMBER);
            const LABEL = 'needs-human-review';
            const conclusionFor = { pass: 'success', block: 'failure', escalate: 'neutral' };

            const results = JSON.parse(fs.readFileSync('ai-review-results.json', 'utf8'));
            let anyEscalate = false;

            for (const r of results) {
              const v = r.resolved.effectiveVerdict;
              if (v === 'escalate') anyEscalate = true;
              const findings = (r.resolved.findings || [])
                .map((f) => `- **${f.severity}** \`${f.location}\` — ${f.why}\n  > ${String(f.evidence).slice(0, 300)}\n  _fix:_ ${f.fix}`)
                .join('\n');
              const downgrade = r.resolved.downgraded ? ` (downgraded from block: ${r.resolved.downgradeReason})` : '';
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: `ai-review: ${r.title}`,
                head_sha: headSha,
                status: 'completed',
                conclusion: conclusionFor[v] || 'neutral',
                output: {
                  title: `${r.title}: ${v}${downgrade}`,
                  summary: `${r.resolved.summary || ''}\n\n**Confidence:** ${r.raw.confidence}\n\n${findings || '_No findings._'}`,
                },
              });
            }

            if (anyEscalate) {
              await github.rest.issues
                .addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, labels: [LABEL] })
                .catch((e) => core.warning(`addLabel: ${e.message}`));
            } else {
              await github.rest.issues
                .removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, name: LABEL })
                .catch(() => {}); // not present — fine
            }
