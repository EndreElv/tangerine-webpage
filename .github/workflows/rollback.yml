name: Auto-rollback

# Fires when the post-deploy smoke workflow fails on production. Reverts the
# offending commit through a revert PR (respects branch protection — no bypass),
# with a circuit-breaker against revert loops. Vercel Instant Rollback is the
# manual fast fallback (see docs/agent/pipeline-setup.md).

on:
  workflow_run:
    workflows: ["Smoke (post-deploy)"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  rollback:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Revert the failed deploy (with circuit-breaker)
        run: node scripts/rollback.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
