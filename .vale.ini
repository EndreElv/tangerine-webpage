# Vale lints the BUILT HTML (rendered prose), which avoids parsing .astro/.ts
# source and checks what users actually read. Run after a build, against dist/.
# Config is CODEOWNER-owned (vale/ + this file) so the agent can't relax a rule
# it trips.
StylesPath = vale/styles
MinAlertLevel = error

[dist/**/*.html]
BasedOnStyles = Tangerine
# Only check human prose; ignore code/script/style blocks.
TokenIgnores = (<script[\s\S]*?</script>), (<style[\s\S]*?</style>)
